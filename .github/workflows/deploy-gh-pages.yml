name: Deploy web/ to gh-pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (needed by some actions)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Debug: list repo and web dir
        run: |
          echo "PWD: $(pwd)"
          echo "ROOT files:"
          ls -la
          echo "WEB files:"
          ls -la web || true
          echo "WEB index (head):"
          head -n 20 web/developer.html || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          keep_history: true
